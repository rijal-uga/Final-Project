<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelacak Tindak Lanjut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: satu kolom kerja. Ringkasan di atas, form tambah, lalu daftar arahan yang bisa difilter. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#14232e; --muted:#5b6b77; --line:#d9e0e5;
  --accent:#0b5f7a; --accent-fg:#ffffff; --accent-soft:#e1f0f5;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#8a5a00; --warn-soft:#fff1d6; --ok:#1c6b43; --ok-soft:#dff3e8;
  --display:'Fraunces',Georgia,serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171d; --surface:#16232b; --fg:#e6eef3; --muted:#93a5b1; --line:#27384333;
  --accent:#5cc0de; --accent-fg:#06222c; --accent-soft:#17323d;
  --bad:#ff8f84; --bad-soft:#3d1c19; --warn:#f2c56b; --warn-soft:#3a2d0e; --ok:#7fd6a5; --ok-soft:#14301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171d; --surface:#16232b; --fg:#e6eef3; --muted:#93a5b1; --line:#27384333;
  --accent:#5cc0de; --accent-fg:#06222c; --accent-soft:#17323d;
  --bad:#ff8f84; --bad-soft:#3d1c19; --warn:#f2c56b; --warn-soft:#3a2d0e; --ok:#7fd6a5; --ok-soft:#14301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:880px;margin:0 auto;display:grid;gap:18px}
h1{font:600 28px/1.15 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile b{display:block;font:500 28px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)} .tile.ok b{color:var(--ok)}
.tile[aria-pressed="true"]{outline:2px solid var(--accent)}
form{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;grid-template-columns:2fr 1fr 1.3fr 1fr auto;align-items:end}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,button{font:inherit}
input,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
button.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;min-width:0}
li.done .t{text-decoration:line-through;color:var(--muted)}
.t{font-weight:500;overflow-wrap:anywhere}
.meta{grid-column:1;color:var(--muted);font-size:13px;display:flex;gap:6px 12px;flex-wrap:wrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{font-size:12px;border-radius:99px;padding:2px 9px;font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.mute{background:var(--accent-soft);color:var(--accent)}
.act{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:flex-start}
.ex{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px}
.empty{color:var(--muted);text-align:center;padding:24px;background:var(--surface);border:1px dashed var(--line);border-radius:8px}
pre{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 var(--mono);margin:0;overflow-wrap:anywhere}
@media (max-width:720px){form{grid-template-columns:1fr 1fr}form label:first-child{grid-column:1/-1}.act{grid-row:auto;grid-column:1}li{grid-template-columns:1fr}}
</style>

<style>body{margin:0}</style>
</head>
<body>
<main>
  <header>
    <h1>Pelacak Tindak Lanjut</h1>
    <p class="sub">Catat arahan dari rapat, lihat mana yang terlambat, dan salin ringkasan siap kirim ke WhatsApp.</p>
  </header>

  <section class="tiles" id="tiles" aria-label="Ringkasan"></section>

  <form id="f">
    <label>Arahan<input id="in-t" placeholder="Mis. Siapkan paparan evaluasi triwulan" required></label>
    <label>PIC<input id="in-p" placeholder="Nama PIC" required></label>
    <label>Tenggat (wajib)<input id="in-d" type="date" required></label>
    <label>Dari<select id="in-s"><option>GM</option><option>Manajer</option><option>Rapat rutin</option></select></label>
    <button class="primary" type="submit">Tambah</button>
  </form>

  <div class="bar">
    <strong id="count"></strong>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost" id="btn-clear" type="button">Hapus data contoh</button>
      <button class="ghost" id="btn-wa" type="button">Salin ringkasan WhatsApp</button>
    </span>
  </div>
  <ul id="list"></ul>
  <pre id="out" hidden></pre>
</main>

<script>
const KEY='tindak-lanjut-v1';
const DAY=86400000;
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime()};
const off=n=>iso(today()+n*DAY);
function seed(){return[
 {id:1,t:'Siapkan bahan paparan evaluasi triwulan untuk GM',p:'Rina',d:off(-3),s:'GM',st:'proses',ex:1},
 {id:2,t:'Rekap tindak lanjut temuan audit internal',p:'Dimas',d:off(1),s:'Manajer',st:'belum',ex:1},
 {id:3,t:'Kirim notulen rapat koordinasi ke seluruh peserta',p:'Sari',d:off(2),s:'Rapat rutin',st:'belum',ex:1},
 {id:4,t:'Perbarui data kinerja bulanan di slide ringkasan',p:'Rina',d:off(9),s:'Manajer',st:'belum',ex:1},
 {id:5,t:'Jadwalkan rapat lanjutan bersama unit terkait',p:'Dimas',d:off(-6),s:'GM',st:'selesai',ex:1}]}
let items=[];let filter='semua';
try{const r=localStorage.getItem(KEY);items=r?JSON.parse(r):seed()}catch(e){items=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'tanpa tenggat';
function diff(it){return it.d?Math.round((new Date(it.d+'T00:00:00').getTime()-today())/DAY):null}
function kind(it){if(it.st==='selesai')return'selesai';const n=diff(it);if(n===null)return'berjalan';if(n<0)return'terlambat';if(n<=3)return'segera';return'berjalan'}
function render(){
  const k={terlambat:0,segera:0,berjalan:0,selesai:0};items.forEach(i=>k[kind(i)]++);
  const T=[['semua','Semua arahan',items.length,''],['terlambat','Terlambat',k.terlambat,'bad'],['segera','Jatuh tempo ≤ 3 hari',k.segera,'warn'],['selesai','Selesai',k.selesai,'ok']];
  $('tiles').innerHTML=T.map(([f,l,n,c])=>`<button class="tile ${c}" data-f="${f}" aria-pressed="${filter===f}"><b>${n}</b><span>${l}</span></button>`).join('');
  const rows=items.filter(i=>filter==='semua'||kind(i)===filter).sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999'));
  $('count').textContent=rows.length+' arahan';
  $('list').innerHTML=rows.length?rows.map(i=>{const kd=kind(i),n=diff(i);
    const pill=kd==='terlambat'?`<span class="pill bad">Terlambat ${-n} hari</span>`:kd==='segera'?`<span class="pill warn">${n===0?'Hari ini':n+' hari lagi'}</span>`:kd==='selesai'?`<span class="pill ok">Selesai</span>`:`<span class="pill mute">${i.st==='proses'?'Dalam proses':'Belum mulai'}</span>`;
    return`<li class="${i.st==='selesai'?'done':''}"><div class="t">${esc(i.t)}</div>
    <div class="meta"><span>PIC: ${esc(i.p)}</span><span class="mono">${fmt(i.d)}</span><span>Dari ${esc(i.s)}</span>${pill}${i.ex?'<span class="ex">contoh</span>':''}</div>
    <div class="act"><button class="ghost" data-a="adv" data-id="${i.id}">${i.st==='belum'?'Mulai':i.st==='proses'?'Selesaikan':'Buka lagi'}</button><button class="ghost" data-a="del" data-id="${i.id}" aria-label="Hapus">Hapus</button></div></li>`}).join(''):'<li class="empty" style="display:block">Belum ada arahan di kategori ini.</li>';
}
$('tiles').onclick=e=>{const b=e.target.closest('.tile');if(b){filter=b.dataset.f;render()}};
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const it=items.find(i=>i.id==b.dataset.id);
  if(b.dataset.a==='del')items=items.filter(i=>i!==it);else it.st=it.st==='belum'?'proses':it.st==='proses'?'selesai':'belum';save();render()};
$('f').onsubmit=e=>{e.preventDefault();items.push({id:Date.now(),t:$('in-t').value.trim(),p:$('in-p').value.trim(),d:$('in-d').value,s:$('in-s').value,st:'belum'});
  $('in-t').value='';$('in-d').value='';save();render();$('in-t').focus()};
$('btn-clear').onclick=()=>{items=items.filter(i=>!i.ex);save();render()};
$('btn-wa').onclick=()=>{
  const open=items.filter(i=>i.st!=='selesai'&&(kind(i)==='terlambat'||kind(i)==='segera'));
  const by={};open.forEach(i=>(by[i.p]=by[i.p]||[]).push(i));
  let txt='*Pengingat Tindak Lanjut*\n'+fmt(iso(today()))+'\n';
  Object.keys(by).forEach(p=>{txt+='\n*'+p+'*\n';by[p].forEach(i=>{const n=diff(i);txt+='- '+i.t+' ('+(n<0?'terlambat '+(-n)+' hari':n===0?'hari ini':n+' hari lagi')+')\n'})});
  const o=$('out');o.hidden=false;o.textContent=txt;
  if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});
  const r=document.createRange();r.selectNodeContents(o);const s=getSelection();s.removeAllRanges();s.addRange(r)};
render();
</script>
</body>
</html>
